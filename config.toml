# efp configuration. Copy to config.toml (committed; it holds no secrets).
# Secrets are read from ~/.config/efp/.env only. Every key here is documented;
# a build may add keys but must document them in this file in the same PR.

[project]
name = "efp"
user_agent = "efp-research/0.1 (University of New Haven, National Security; contact: mconr5@unh.newhaven.edu)"
contact = "mconr5@unh.newhaven.edu"

[paths]
# Everything the pipeline writes lives under data_dir, outside the repository, on an encrypted volume.
data_dir = "~/efp-data"
source_workbook = "~/efp-data/source/heritage-voter-fraud-map-search-20260406150111.xlsx"
database = "~/efp-data/pipeline.db"
store = "~/efp-data/store"
bulk = "~/efp-data/bulk"
manifests = "~/efp-data/manifests"
bags = "~/efp-data/bags"
cache = "~/efp-data/cache"            # HTTP cache and rate-limit state (SQLite)
warc = "~/efp-data/store/warc"        # one WARC 1.1 file per UTC day, inside the bagged store
logs = "~/efp-data/logs"
exports = "~/efp-data/exports"
import_inbox = "~/efp-data/import"
env_file = "~/.config/efp/.env"

[scope]
# "all" = every row with year 2000-2025 (first-pass default; decision 2 is unanswered).
# "convictions" = criminal convictions only. Changing this changes the export filter, not the research.
population = "all"
year_from = 2000
year_to = 2025
# The 50-row stratified sample is drawn in build 03 and frozen by hash; runs with --sample
sample_size = 50
sample_seed = 20261027
# Where `efp ingest` writes the frozen sample: row_id and row_sha256 only, no names. Repo-relative.
sample_file = "tests/fixtures/sample_rows.json"

[first_pass]
# Flags that keep the first pass within docs/plan.md. Do not flip these without the operator.
online_only = true
social_enabled = true             # D10 runs in the first pass
voter_file_enrichment = false     # NC and OH direct downloads only if decision 6 is answered yes
people_search_enabled = false     # never true; present so the audit log can prove it was off
google_search_enabled = false     # optional discovery for pre-2017 coverage; capped below
commoncrawl_enabled = true        # resolve.commoncrawl: second chance for a dead link (not on the plan allowlist; operator enabled it for build 06)
bitly_info_enabled = true         # resolve.bitly_info: Bitly's + page when a bit.ly/herit.ag link fails live (spec section 6; not on the plan allowlist; operator enabled it)

[court]
# Court-record stage (build 07).
pin_report_urls = []              # Public Integrity Section "Federal Prosecution of Election Offenses" PDFs (2000-2012 editions); the operator supplies the URLs
recap_enabled = false             # RECAP Fetch needs PACER credentials and costs fees; the first pass never fetches from PACER
bulk_listing_url = "https://com-courtlistener-storage.s3-us-west-2.amazonaws.com/?list-type=2&prefix=bulk-data/"
bulk_download_base = "https://com-courtlistener-storage.s3-us-west-2.amazonaws.com/"
bulk_max_gb = 150                 # `efp court bulk fetch` refuses to download more than this
bulk_index_file = "courtlistener.duckdb"   # inside paths.bulk
window_years_after = 1            # a docket may be filed this many years after the row's year
terminated_slack_years = 1        # and must not have ended this many years before it
top_candidates = 5                # dockets kept per row from the bulk index
doj_year_slack = 1                # DOJ releases within this many years of the row's year
doj_pagesize = 50                 # the API maximum
doj_harvest_max_pages = 4000      # cap on the date-sorted harvest used if the server ignores the title search
doj_harvest_pages_per_row = 25    # pages of that harvest one row may fetch (~1 minute); `efp court doj harvest` does the rest in one go
ag_harvest_pages_per_row = 5      # pages of a state AG release index one row may fetch; `efp court ag harvest` does the rest
ag_harvest_max_pages = 1500       # cap on the pages (or months) one state's index harvest walks in total
ag_max_candidates = 20            # election-related releases read per row
docket_terms_cleared = []         # states whose docket-portal terms you have read and cleared for automated search (e.g. ["WI"]); empty = nothing is automated
docket_assisted_limit = 50        # rows `efp review court --assisted` lists at once
docket_max_hits = 10              # dockets recorded per row; past it (a common name) the rest are not fetched and the row stays a candidate
docket_browser_image = "webrecorder/browsertrix-crawler:1.13.2"  # pinned (a version or digest: `latest` is refused); run in Docker, only for JS-only portals whose terms allow a browser
pacer_queue = "queues/pacer.csv"  # federal dockets whose documents are not in RECAP; a relative path is under paths.data_dir (it names row ids and case numbers)

[rate_limits]
# Requests per second per domain: 80% of the published limit, or 1 request per 2 seconds where none is published (spec section 10).
default_rps = 0.5
"www.justice.gov" = 3.0           # DOJ: published < 4/s
"www.courtlistener.com" = 0.8     # REST quota is per day (125 default); the daily cap is below
"web.archive.org" = 0.32          # 80% of the published ~0.4/s (CDX and Availability)
"archive.org" = 0.32              # the Availability API host: same budget
"api.gdeltproject.org" = 0.16     # 80% of one request per 5 seconds (0.2/s)
"api.open.fec.gov" = 0.22         # 80% of 1,000 requests per hour (0.278/s)
"api.congress.gov" = 1.1            # 80% of the published 5,000/hour (1.39/s)
"v3.openstates.org" = 0.5         # undocumented and restrictive: 1 request per 2 seconds
"ballotpedia.org" = 0.2           # low rate, read only
"oag.ca.gov" = 0.08               # 80% of the published Crawl-delay of 10 seconds (0.1/s)
retry_attempts = 3
retry_backoff_seconds = 5

[rate_limits.daily_caps]
"www.courtlistener.com" = 100     # 80% of the 125/day default quota

[capture]
timeout_seconds = 10
max_redirects = 10
cache_expire_hours = 24           # default freshness for cached responses where the server sends no Cache-Control
max_wait_seconds = 300            # longest a fetch will wait for its domain budget before failing the request
spn_per_minute = 4                # Save Page Now 2 publishes ~6/min authenticated; 80% rounded down
tsa_urls = ["http://timestamp.digicert.com", "http://freetsa.org/tsr"]

[runner]
batch_size = 50
max_attempts_per_stage = 3
stale_after_minutes = 120        # a stage row still `running` after this long is reset to pending (no attempt counted)
# Stages in the first pass, in predecessor order; export is a command, not a stage.
stages = ["resolve_links", "court", "identity", "documents", "news", "social", "extract", "code"]

# Module chains per stage (build 04). Order matters; policy is first_hit | all | first_available | ladder.
# A module that is unavailable (no key, gated, tool missing, no labels yet) is skipped with its reason recorded.
[stages.resolve_links]
modules = ["resolve.live", "resolve.bitly_info", "resolve.wayback_short", "resolve.wayback_target", "resolve.commoncrawl"]
policy = "first_hit"

[stages.court]
modules = ["court.doj", "court.pin_reports", "court.state_ag", "court.courtlistener_bulk", "court.courtlistener_api", "court.recap", "court.state_docket"]
policy = "first_hit"

[stages.documents]
modules = ["documents.pdfplumber", "documents.docling", "documents.ocrmypdf", "documents.paddleocr", "documents.claude_transcribe"]
policy = "ladder"

[stages.identity]
candidate_modules = ["identity.cand.court", "identity.cand.dime", "identity.cand.fec", "identity.cand.ftm", "identity.cand.harvard_local", "identity.cand.legislators", "identity.cand.voter_file"]
candidate_policy = "all"
parameter_modules = ["identity.params.labeled_pairs", "identity.params.published_priors"]
parameter_policy = "first_available"

[stages.news]
modules = ["news.gdelt", "news.mediacloud", "news.wayback_outlets", "news.google_cse"]
policy = "all"

[stages.import]
modules = ["import.pdf", "import.saved_html", "import.hunchly"]
policy = "first_available"

[stages.social]
enumerate_modules = ["social.enumerate.naminter", "social.enumerate.maigret"]
enumerate_policy = "all"
retrieve_modules = ["social.retrieve.bluesky", "social.retrieve.reddit_r4r", "social.retrieve.meta_content_library", "social.retrieve.x_api"]
retrieve_policy = "all"           # the last three are gated (applications or paid) and report themselves unavailable
allowlist_path = "allowlist.json"

[stages.extract]
modules = ["extract.langextract", "extract.instructor", "extract.anthropic_citations"]
policy = "first_available"
require_sample_approval = false   # true = hold the volume run until `efp run extract --approve-volume`

[stages.reference]
modules = ["reference.census_surnames", "reference.ssa_names", "reference.census_population", "reference.census_place_county", "reference.fec_candidates", "reference.congress", "reference.openstates", "reference.harvard_local", "reference.dime", "reference.ftm", "reference.wmn"]
policy = "all"

[stages.archive]
modules = ["archive.spn", "archive.perma", "archive.autoarchiver"]
policy = "all"

[stages.validate]
label_modules = ["validate.labels.gold_set", "validate.labels.sample_tally", "validate.labels.none"]
label_policy = "first_available"

[identity]
confirm_threshold = 0.99
review_threshold = 0.90
labeled_pairs_required = 150      # the operator labels these in `efp review` before thresholds are set
audit_sample = 50                 # the F3 false-confirmation audit
ssa_state_min_births = 100000     # the by-state SSA file is used when the state has this many births in the cohort and sex
prior_pseudocount = 20            # labeled fit: weight (in pairs) given to the published value
common_surname_rank = 1000        # Census rank at or below which a surname is "common" (F3 strata, label strata)
reviewer_initials = ""            # decided_by on your labels and verdicts; empty = you are asked once
label_seed = 12                   # fixed seeds: the 150-pair queue and the 50-row audit draw are reproducible
audit_seed = 12
bootstrap_resamples = 10000
tf_adjustment_cap = true          # term-frequency adjustment may lower a match weight but never raise it (build 12, decision 1)

[documents]
ocr_quality_threshold = 0.85      # pages below this are review-flagged and never reach extraction unflagged
llm_transcription_fallback = false  # OFF: true sends page IMAGES of court documents to api.anthropic.com (names, addresses, dockets leave ~/efp-data); the operator opts in. When on, only a page the OCR rungs failed on, within the budget
docling_always = false            # true: run Docling over every PDF (structure for born-digital documents too); false: only when a page falls past the first rung
ocr_language = "eng"              # Tesseract / OCRmyPDF language pack
render_dpi = 200                  # page images for OCR, the blank check and model transcription
max_pages = 500                   # a longer document is read (and OCR'd, and sent to Docling) to this page only; the rest is recorded as not read. Raise it for very long filings
docling_timeout_seconds = 900     # per document: Docling stops there and keeps the pages it finished
ocr_timeout_seconds = 300         # OCRmyPDF's base allowance per document ...
ocr_seconds_per_page = 30         # ... plus this per page read (max_pages caps it): 500 pages = 300 + 15,000 s. A document that still times out is retried after you raise either (the hash includes both)
transcribe_max_tokens = 4096      # model transcription of one page

[reference]
# Reference datasets (build 11): bulk files loaded once into the ref_* tables. Raw files live under paths.bulk.
max_gb = 20.0                     # a download whose size is announced above this is refused (DIME's SQLite build may be huge)
download_user_agent = ""          # a browser-style User-Agent used ONLY for the hosts below, and only to retry once after a rejection page; empty = never. See docs/sources.md
download_user_agent_hosts = ["www2.census.gov", "www.ssa.gov"]
fec_first_cycle = 2000            # FEC Candidate Master cn<yy>.zip, one per two-year cycle
fec_last_cycle = 2026
census_surnames_url = "https://www2.census.gov/topics/genealogy/2010surnames/names.zip"
ssa_national_url = "https://www.ssa.gov/oact/babynames/names.zip"
ssa_state_url = "https://www.ssa.gov/oact/babynames/state/namesbystate.zip"
census_population_url = "https://www2.census.gov/programs-surveys/popest/datasets/2020-2023/state/asrh/sc-est2023-agesex-civ.csv"
census_place_county_url = "https://www2.census.gov/geo/docs/reference/codes2020/national_place_by_county2020.txt"
fec_url_template = "https://www.fec.gov/files/bulk-downloads/{year}/cn{yy}.zip"
congress_current_url = "https://unitedstates.github.io/congress-legislators/legislators-current.yaml"
congress_historical_url = "https://unitedstates.github.io/congress-legislators/legislators-historical.yaml"
openstates_archive_url = "https://github.com/openstates/people/archive/refs/heads/main.zip"
wmn_url = "https://raw.githubusercontent.com/WebBreacher/WhatsMyName/main/wmn-data.json"
harvard_osf_node = "mv5e6"        # OSF project of the Harvard local elections database (doi 10.17605/OSF.IO/MV5E6)
dime_url = ""                     # DIME v4 has no stable download URL: the file was downloaded by hand and loaded with `efp reference import dime FILE` (loaded 2026-11-23); set this only to fetch it again
ftm_url = ""                      # FollowTheMoney is gated (an account key, an unmaintained site, data to 2024): leave empty; the module is skipped with that reason

[llm]
provider = "anthropic"
model = "claude-sonnet-5-5"       # Sonnet-class for extraction; pinned in build 01, UNVERIFIED against the API until the first call; logged per call with the prompt hash
transcription_model = "claude-sonnet-5-5"   # OCR fallback on page images; few pages, same tier
temperature = 0.0                 # the project rule's value, recorded for the audit; NEVER SENT (API version 2026-10-21 rejects it, confirmed live): see efp/llm.py
max_monthly_usd = 150.0           # the run stops at this cap
price_input_per_mtok = 2.0        # USD per million input tokens (claude-sonnet-5-5 list price); the spend cap is computed from this
price_output_per_mtok = 10.0      # USD per million output tokens
sample_runs = 3                   # three runs on the sample, disagreement flagged

[search]
google_cse_daily_cap = 100        # the free tier; set to 0 to disable

[export]
provisional_prefix = "prov_"      # new columns are appended under this prefix until the build 21 review lifts it
redacted_csv = true
# Decision 3: how Partisan Direction maps onto the Ideological Motivation dropdown. Export-time rule; change it and re-export.
independent_means = "unaffiliated"   # one of: unaffiliated | centrist | nonpartisan_direction

[database]
busy_timeout_ms = 5000            # how long a writer waits on a locked database (SQLite busy_timeout)
selftest_capture_sample = 200     # `efp selftest --db` hashes every captured body up to this many, else a seeded sample

[logging]
level = "INFO"                    # DEBUG | INFO | WARNING | ERROR | CRITICAL; JSON lines go to paths.logs/efp.log, readable lines to the console
