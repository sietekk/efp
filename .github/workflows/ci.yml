name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.9"
      - run: uv python install 3.12
      # The documents tests run the real OCR path: Tesseract and Ghostscript are system packages.
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr ghostscript
      - run: uv sync --locked --extra documents
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy efp
      # The live marker is never run in CI.
      - run: uv run pytest -m "not live"
      # Fresh clone, no data directory: these must work.
      - run: uv run efp --version
      - run: uv run efp selftest
